name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check
        [open issues](https://github.com/szaghi/VTKFortran/issues) and
        [discussions](https://github.com/szaghi/VTKFortran/discussions)
        to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        Describe the use case or problem this feature would solve.
        Explaining *why* you need it helps design the right interface.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like VTKFortran to do? Include API sketches, new
        `write_geo` / `write_dataarray` signatures, or topology names if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have already tried.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to VTK XML spec sections, screenshots, or other relevant information.
