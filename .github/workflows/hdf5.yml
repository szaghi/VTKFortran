name: HDF5

# Project-owned workflow (not managed by `fobis scaffold`): the library and the tests built with HDF5 (VTKHDF format)
# and MPI (VTKFORTRAN_USE_MPI), with FoBiS and with CMake, in the toolchain image (gfortran 16.2, Open MPI 5.0.11 and
# HDF5 2.3.0 parallel, built by it), and the test of one file written by MPI ranks on 4 ranks. The CI workflow builds
# without HDF5, where the HDF5 procedures are stubs. No older HDF5 is tested: no compatibility floor (fortran-toolchains
# #2 rule 3).

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdf5-mpi:
    name: hdf5-mpi / gfortran-16.2 + Open MPI (toolchain image)
    runs-on: ubuntu-24.04
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch dependencies
      run: fobis fetch

    # run_tests.sh runs the MPI test on one rank (its name has no "mpi"): then on 4
    - name: Build and run the tests (FoBiS)
      run: |
        fobis build --mode tests-gnu-debug-hdf5-mpi --varset toolchain-image
        bash scripts/run_tests.sh
        mpirun -np 4 exe/vtk_fortran_write_vtkhdf_ranks

    - name: Build and run the tests (CMake)
      run: |
        cmake -S . -B build -DBUILD_TESTING=ON -DVTKFORTRAN_USE_ZLIB=ON -DVTKFORTRAN_USE_HDF5=ON -DVTKFORTRAN_USE_MPI=ON \
              -DHDF5_USE_STATIC_LIBRARIES=ON
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure
