name: HDF5

# Project-owned workflow (not managed by `fobis scaffold`): the library and the tests built with HDF5 (VTKHDF format),
# against Ubuntu's serial libhdf5-dev (HDF5 1.10, the oldest HDF5 supported), with FoBiS and with CMake. The CI workflow
# builds without HDF5, where the HDF5 procedures are stubs. The job hdf5-mpi builds with MPI (VTKFORTRAN_USE_MPI) in
# the toolchain image (gfortran 16.2, Open MPI 5.0.11 and HDF5 2.3.0 parallel, built by it) and runs the test of one
# file written by MPI ranks on 4 ranks.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdf5:
    name: hdf5 / gfortran-14 (Ubuntu's libhdf5-dev)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # a fresh Ubuntu 24.04 runner, not an image: its serial HDF5 1.10 is the oldest supported. Its compiler is Ubuntu's
    # gfortran 14: Ubuntu 24.04 has no gfortran 16 release (the toolchain PPA ships a 16.0.1 snapshot, which crashes
    # in FoXy's add_tag on vtk_fortran_read_composite; gfortran 16.2 in the image of hdf5-mpi passes)
    - name: Install gfortran 14, HDF5, FoBiS and CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran-14 zlib1g-dev libhdf5-dev
        sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-14 100 \
                                 --slave /usr/bin/gcov gcov /usr/bin/gcov-14
        python3 -m venv "$RUNNER_TEMP/venv" # Ubuntu's python3 is externally managed (PEP 668)
        "$RUNNER_TEMP/venv/bin/pip" install --quiet FoBiS.py cmake # cmake: not on every runner image (act's)
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        gfortran --version | sed -n 1p
        "$RUNNER_TEMP/venv/bin/fobis" --version

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build and run the tests (FoBiS)
      run: |
        fobis build --mode tests-gnu-debug-hdf5
        bash scripts/run_tests.sh

    - name: Build and run the tests (CMake)
      run: |
        cmake -S . -B build -DBUILD_TESTING=ON -DVTKFORTRAN_USE_ZLIB=ON -DVTKFORTRAN_USE_HDF5=ON
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure

  hdf5-mpi:
    name: hdf5-mpi / gfortran-16.2 + Open MPI (toolchain image)
    runs-on: ubuntu-24.04
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch dependencies
      run: fobis fetch

    # run_tests.sh runs the MPI test on one rank (its name has no "mpi"): then on 4
    - name: Build and run the tests (FoBiS)
      run: |
        fobis build --mode tests-gnu-debug-hdf5-mpi --varset toolchain-image
        bash scripts/run_tests.sh
        mpirun -np 4 exe/vtk_fortran_write_vtkhdf_ranks

    - name: Build and run the tests (CMake)
      run: |
        cmake -S . -B build -DBUILD_TESTING=ON -DVTKFORTRAN_USE_ZLIB=ON -DVTKFORTRAN_USE_HDF5=ON -DVTKFORTRAN_USE_MPI=ON \
              -DHDF5_USE_STATIC_LIBRARIES=ON
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure
