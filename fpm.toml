name = "VTKFortran"
version = "3.1.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2022, Stefano Zaghi"
license = "Multiple licenses"
description = "pure Fortran VTK (XML) API"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/VTKFortran"

[library]
source-dir = "src/lib"

# the C preprocessor: fpm then evaluates the #ifdef blocks when it scans the module dependencies, so the guarded
# `use mpi_f08` of vtk_fortran_hdf5.F90 (VTKFORTRAN_USE_MPI, defined only by the MPI builds) is not a dependency
[preprocess]
[preprocess.cpp]

[install]
library = true

[features]
#optimization
opt.gfortran.flags = "-O3"
opt.ifx.flags = "-O3 -ipo -inline-level=2 -heap-arrays 0"

#check
check.gfortran.flags = "-fcheck=all"
check.ifx.flags = """-check all"""

#warn
warn.gfortran.flags = """-fmax-errors=0 -Wall -Wno-array-temporaries \
-Warray-bounds -Wcharacter-truncation -Wline-truncation -Wconversion-extra \
-Wimplicit-interface -Wimplicit-procedure -Wunderflow -Wextra -Wuninitialized"""
warn.ifx.flags = "-warn all"

#debug
debug.gfortran.flags = """-fmodule-private -ffree-line-length-132 -fimplicit-none \
-ffpe-trap=invalid,overflow -fbacktrace -fdump-core -finit-real=nan"""
debug.ifx.flags = """-g -extend-source 132 -fpe0 -fstack-protector-all -no-ftz -traceback"""

#optional openmp
omp.gfortran.flags = "-fopenmp"
omp.ifx.flags = "-qopenmp"
#optional enforce 2003 standard
std03.gfortran.flags = "-std=f2003 -fall-intrinsics"
std03.ifx.flags = "-std03"

[profiles]
release = ["opt", "warn", "check", "debug"]
release-omp = ["opt", "warn", "check", "debug", "omp"]

[dependencies]
[dependencies.FoXy]
git = "https://github.com/szaghi/FoXy"
branch = "master"

[dependencies.PENF]
git = "https://github.com/szaghi/PENF"
branch = "master"

[dependencies.BeFoR64]
git = "https://github.com/szaghi/BeFoR64"
branch = "master"

[dependencies.StringiFor]
git = "https://github.com/szaghi/StringiFor"
branch = "master"

# the tests of src/tests that need no HDF5, zlib, MPI or OpenMP, run by `fpm test` (fpm looks in test/); the others
# need the libraries the FoBiS and CMake builds link
[build]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "vtk_fortran_use_module_basic"
source-dir = "src/tests"
main = "vtk_fortran_use_module_basic.f90"

